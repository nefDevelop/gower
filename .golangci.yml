version: "2"
linters:
  enable:
    - errcheck
    - unused
    - ineffassign
    - staticcheck
  exclusions:
    paths:
      - /usr/local/go/
      - vendor/
    rules:
      - path: _test\.go
        linters:
          - errcheck
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - gower
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
