name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Fijado a 24.04 en lugar de ubuntu-latest: la etiqueta migrará a Ubuntu 26
    # el 19-10-2026 (actions/runner-images#14748) y ese cambio no está probado.
    runs-on: ubuntu-24.04
    # El PAT se expone a nivel de job para poder condicionar el paso de aviso
    # con `if: env...`, ya que `if` no puede leer secrets directamente.
    env:
      GOWER_DISPATCH_TOKEN: ${{ secrets.GOWER_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Build all binaries
        run: make build-all

      - name: Generate checksums
        # gowerGUI verifica el sidecar descargado contra este fichero.
        run: |
          set -euo pipefail
          cd dist
          sha256sum linux/gower windows/gower.exe > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux/gower
            dist/windows/gower.exe
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch gowerGUI sidecar bump
        # El release ya está publicado en el paso anterior: un fallo al avisar
        # NO debe marcarlo como fallido. Si el PAT no tiene acceso a gowerGUI,
        # GitHub responde 404 (no 403); se avisa y se sigue. El bump se puede
        # relanzar a mano con workflow_dispatch en gowerGUI.
        if: ${{ env.GOWER_DISPATCH_TOKEN != '' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          HTTP=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" -X POST \
            -H "Authorization: token ${GOWER_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/nefDevelop/gowerGUI/dispatches" \
            -d "{\"event_type\":\"gower-release\",\"client_payload\":{\"tag\":\"${TAG}\"}}")
          if [ "$HTTP" = "204" ]; then
            echo "Dispatched gower-release for ${TAG}"
          else
            echo "::warning::no se pudo avisar a gowerGUI (HTTP $HTTP). Comprueba que GOWER_DISPATCH_TOKEN tenga Contents: Read and write sobre gowerGUI."
            cat /tmp/dispatch.out || true
          fi