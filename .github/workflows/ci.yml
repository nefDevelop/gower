name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # Fijado a 24.04 en lugar de ubuntu-latest: la etiqueta migrará a Ubuntu 26
    # el 19-10-2026 (actions/runner-images#14748) y ese cambio no está probado.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -shuffle=on baraja la ejecucion para detectar acoplamiento de orden.
        # Los tests de cmd comparten globals (flags, config, y los *cobra.Command
        # que newTestRootCmd reparenta), y un test que aborte antes de restaurarlos
        # rompia al siguiente en silencio. Con el barajado, esa fuga se ve.
        run: go test ./... -count=1 -shuffle=on

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Version fijada: a partir de v2.5.0 golangci-lint se compila con
          # go1.25. Las anteriores (v2.0-v2.4) se compilan con go1.24 y el
          # linter aborta con "the Go language version used to build
          # golangci-lint is lower than the targeted Go version (1.25.6)".
          version: v2.5.0
